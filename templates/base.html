<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Question Upload Dashboard{% endblock %}</title><link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><aside><a class="brand" href="/">Q<span>U</span></a><nav><a href="/" class="{% if request.path == '/' %}active{% endif %}">▦ Dashboard</a><a href="/upload-questions" class="{% if request.path == '/upload-questions' %}active{% endif %}">⇧ Upload Questions</a><a href="/history" class="{% if request.path == '/history' %}active{% endif %}">◷ Upload History</a><a href="/error-questions" class="{% if request.path == '/error-questions' %}active{% endif %}">⚠ Error Questions</a><a href="#settings">⚙ Settings</a></nav><small>Medical education admin</small></aside><main><header><div><p class="eyebrow">QUESTION MANAGEMENT</p><h1>{% block heading %}Dashboard{% endblock %}</h1></div><div class="user">Admin workspace</div></header>{% block content %}{% endblock %}</main><div id="toast" role="status"></div><script src="{{ url_for('static', filename='app.js') }}"></script></body></html>
